  <script>/* 资源 503 自愈（不依赖任何外部文件）：脚本/样式加载失败时整页重拉一次，sessionStorage 防循环 */
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    var bad = t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && /stylesheet/i.test(t.rel || '')));
    if (!bad) return;
    /* 只对本站资源整页重载：外链脚本（登录 SDK 的 CDN）失败时重载会把用户填的表单冲掉 */
    var badSrc = t.src || t.href || '';
    try { if (!badSrc || new URL(badSrc, location.href).origin !== location.origin) return; } catch (x) { return; }
    try {
      if (sessionStorage.getItem('sc_brt')) return;
      sessionStorage.setItem('sc_brt', '1');
      var u = new URL(location.href); u.searchParams.set('r', '1');
      location.replace(u.toString());
    } catch (x) {}
  }, true);</script>
<script>/* 早期主题：抢在首帧前定明暗，避免浅色用户启动闪黑 */
  (function () {
    try {
      var t = 'auto';
      try { var s = (JSON.parse(localStorage.getItem('starcard-state-v1') || '{}').settings) || {}; t = s.theme || 'auto'; } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));
      var r = document.documentElement;
      r.setAttribute('data-theme', dark ? 'dark' : 'light');
      r.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();</script>

  <style id="sc-critical">
  /* 关键内联兜底：外部 CSS 缓存异常时仍有可读的底色。深色 = 黑底玻璃；浅色 = 奶油纸底 */
  html[data-theme="dark"] {
    --bg:#000; --surface:rgba(255,255,255,.062); --surface-2:rgba(255,255,255,.085);
    --ink-1:#fff; --ink-2:rgba(255,255,255,.8); --ink-3:rgba(255,255,255,.56); --ink-4:rgba(255,255,255,.36);
    --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.16);
    --brand:#7FA8FF; --brand-strong:#3E74FF; --brand-soft:rgba(46,107,255,.16);
    color-scheme: dark;
  }
  html[data-theme="dark"], html[data-theme="dark"] body { background:#000 !important; color:#fff; }
  html[data-theme="dark"] body { background-image:
    radial-gradient(900px 520px at 6% -8%, rgba(10,89,247,.20), transparent 62%),
    radial-gradient(760px 460px at 98% 2%, rgba(120,80,255,.13), transparent 58%),
    radial-gradient(820px 540px at 50% 112%, rgba(10,89,247,.09), transparent 62%) !important;
    background-attachment: fixed !important; }
  html[data-theme="light"] {
    --bg:#FFFBF5; --surface:#FFFFFF; --surface-2:#F4F2EC;
    --ink-1:#1F2329; --ink-2:#4A4F57; --ink-3:#7A7F87; --ink-4:#A6ABB3;
    --line:rgba(20,24,32,.10); --line-2:rgba(20,24,32,.16);
    color-scheme: light;
  }
  html[data-theme="light"], html[data-theme="light"] body { background:#FFFBF5; color:#1F2329; }
  </style>
