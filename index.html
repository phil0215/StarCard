<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFBF5" />
  <meta name="description" content="闪星卡（StarCard）· FSRS-5 间隔重复记忆卡，支持 .srcd 导入导出，内置离线 AI 助手小星" />
  <meta name="author" content="小李工作室 XiaoLi Studio" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <title>闪星卡 StarCard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="boot" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#FFFBF5;color:#6E6787;font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
    <div style="text-align:center">
      <div style="font-size:22px;font-weight:700;color:#241C3B;letter-spacing:-.5px">闪星卡</div>
      <div style="margin-top:6px">正在加载…</div>
      <div id="bootErr" style="display:none;margin-top:14px;max-width:300px;font-size:12px;line-height:1.6;color:#F2557C;word-break:break-all"></div>
    </div>
  </div>
  <div id="app"></div>
  
  <!-- 隐藏的文件选择器：导入 .srcd（兼容旧 .fscd）/ Anki .apkg -->
  <input type="file" id="srcdFile" accept=".srcd,.fscd,.json,application/json" style="display:none" />
  <input type="file" id="apkgFile" accept=".apkg,.colpkg,.zip" style="display:none" />
<script src="app.js"></script>
<script src="cloudsync-config.js"></script>
<script src="cloudsync.js"></script>
<script src="store.js"></script>
</body>
</html>
